[project]
name = "aftertalk-engine"
version = "0.0.0"
description = "Aftertalk processing engine: stateless call processing over HTTP"
license = "AGPL-3.0-only"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0,<1.0.0",
    "uvicorn>=0.54.0,<1.0.0",
    "pydantic>=2.14.3,<3.0.0",
    "pydantic-settings>=2.16.3,<3.0.0",
    "pydantic-ai-slim[openai]==2.70.0",
    "httpx>=0.28.1,<1.0.0",
    "av>=19.0.2",
    "numpy>=2.5.5",
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "silero-vad>=6.2.3,<7.0.0",
    "gliner==0.2.30",
    # gliner's tokenizer cannot be loaded by transformers 5 (spike Q1).
    "transformers>=4.57.6,<5",
    "sentencepiece>=0.2.3",
    "protobuf>=7.36.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aftertalk_engine"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
