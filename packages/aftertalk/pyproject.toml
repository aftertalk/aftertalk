[project]
name = "aftertalk"
version = "0.0.0"
description = "Aftertalk: coworkers (AI agents) that act on transcripts, with your own keys and models"
license = "AGPL-3.0-only"
# Torch's TorchScript (used by silero-vad) is not supported on 3.14+.
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14.3,<3.0.0",
    "pydantic-settings>=2.16.3,<3.0.0",
    "pydantic-ai-slim[openai]==2.70.0",
    "httpx>=0.28.1,<1.0.0",
    "av>=19.0.2",
    "numpy>=2.5.5",
    "typer>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
# HTTP server for the web app (`aftertalk serve`).
server = [
    "fastapi>=0.165.0,<1.0.0",
    "uvicorn>=0.54.0,<1.0.0",
]
# Voice detection for two-channel calls.
audio = [
    "torch>=2.8.0",
    "torchaudio>=2.8.0",
    "silero-vad>=6.2.3,<7.0.0",
]
# Name detection for redaction.
pii = [
    "torch>=2.8.0",
    "gliner==0.2.30",
    # gliner's tokenizer cannot be loaded by transformers 5 (spike Q1).
    "transformers>=4.57.6,<5",
    "sentencepiece>=0.2.3",
    "protobuf>=7.36.2",
]
# Local transcription (faster-whisper); packages added in M2.
local = []
# YouTube audio fallback (yt-dlp); packages added in M7.
youtube = []
all = ["aftertalk[server,audio,pii,local,youtube]"]

[project.scripts]
aftertalk = "aftertalk.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aftertalk"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["aftertalk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
