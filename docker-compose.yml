# Production: prebuilt images only. Needs this file and a .env next to it (see .env.example).
name: aftertalk

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: aftertalk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aftertalk
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aftertalk -d aftertalk']
      interval: 5s
      timeout: 3s
      retries: 20

  engine:
    image: ghcr.io/aftertalk/aftertalk-engine:${AFTERTALK_VERSION:-0.0.0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      WEB_URL: http://web:3000
    volumes:
      - data:/data
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: ghcr.io/aftertalk/aftertalk-web:${AFTERTALK_VERSION:-0.0.0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://aftertalk:${POSTGRES_PASSWORD}@postgres:5432/aftertalk
      DATA_DIR: /data
      ENGINE_URL: http://engine:8000
    ports:
      - '3000:3000'
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  data:
  pgdata:
